[project]
name = "opt-agent-v3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bocode>=1.0.1",
    "botorch>=0.18.1",
    "gpytorch>=1.15.2",
    "httpx>=0.27",
    "ioh>=0.3.22",
    "numpy>=2.5.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.6", "httpx[socks]>=0.27"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # CPU-parallel test runs (now the default via addopts; conftest pins
    # 1 torch thread per worker — tiny GP fits thread-thrash otherwise).
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# Parallel by default: per-test distribution spreads the slow GP-fitting
# files across workers (loadfile would serialize on the slowest file).
# Disable for debugging: pytest -n0 (or -p no:xdist); fewer workers: -n 4.
addopts = "-n auto --dist load -q"
