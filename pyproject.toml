[project]
name = "opt-agent-v3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bocode>=1.0.1",
    "botorch>=0.18.1",
    "gpytorch>=1.15.2",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.6", "httpx[socks]>=0.27"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
